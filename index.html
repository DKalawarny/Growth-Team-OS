<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Default head — these are the FALLBACK values served before React mounts
      and before <Helmet> takes over. Per-page values live in src/pages/*.jsx
      and src/lib/seo.js.

      Note for crawlers that don't run JavaScript (some link-preview bots,
      legacy SEO tools): they'll only see what's in this file. The full
      page-specific meta + JSON-LD only renders once React + Helmet mount.
      That's the prerendering gap flagged for a follow-up session.
    -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <meta name="theme-color" content="#0D1413" />
    <link rel="canonical" href="https://eliv8os.com/" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=Inter:wght@600&display=swap">
    <title>Eliv8 OS — an advisor for owners who care how it's run</title>
    <meta
      name="description"
      content="An advisor that reads your actual numbers, remembers what you decided and why, and argues the hard calls both ways. For owners who believe how they run it matters, not only what it earns."
    />
    <meta
      name="keywords"
      content="AI advisor for contractors, home services business software, contractor business management software, AI for service businesses, CFO dashboard for small business, cash flow forecasting for contractors, hiring planner for trades, Google Business Profile audit, local SEO for plumbers electricians HVAC, AI search visibility, contractor CRM, home services CRM, specialty trade contractor software, plumber business software, electrician business software, HVAC business software, roofing business software, demolition contractor software, construction business AI, small business operating system, QuickBooks AI advisor, safety compliance tracking software"
    />
    <meta name="author" content="Eliv8 OS" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#0F172A" />

    <!-- Open Graph / Facebook / Slack / iMessage / LinkedIn / Discord -->
    <meta property="og:type"            content="website" />
    <meta property="og:url"             content="https://eliv8os.com/" />
    <meta property="og:title"           content="Eliv8 OS — an advisor for owners who care how it's run" />
    <meta property="og:description"     content="An advisor that reads your actual numbers, remembers what you decided and why, and argues the hard calls both ways. For owners who believe how they run it matters, not only what it earns." />
    <meta property="og:image"           content="https://eliv8os.com/og-default.png" />
    <meta property="og:image:width"     content="1200" />
    <meta property="og:image:height"    content="630" />
    <meta property="og:site_name"       content="Eliv8 OS" />
    <meta property="og:locale"          content="en_CA" />

    <!-- Twitter / X -->
    <meta name="twitter:card"           content="summary_large_image" />
    <meta name="twitter:url"            content="https://eliv8os.com/" />
    <meta name="twitter:title"          content="Eliv8 OS — an advisor for owners who care how it's run" />
    <meta name="twitter:description"    content="An advisor that reads your actual numbers, remembers what you decided and why, and argues the hard calls both ways. For owners who believe how they run it matters, not only what it earns." />
    <meta name="twitter:image"          content="https://eliv8os.com/og-default.png" />

    <!-- Mobile / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eliv8 OS" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Default Organization JSON-LD — present even before React mounts so
         crawlers without JS still know who runs the site. Per-page schemas
         (SoftwareApplication, Product, FAQPage) are added by Helmet.

         ⚠️ KEEP THIS IN STEP WITH organizationSchema() in src/lib/seo.js.
         It drifted once and nobody noticed: this description still defined
         Eliv8 OS by SECTOR — a tool for one set of trades — months after the
         reposition put the buyer on conviction instead. It is the FIRST thing
         every crawler reads and the last thing anyone thinks to check, the
         same failure as the JSON-LD that went on advertising an old price.
         (Comments ship to the browser, so don't quote the wrong copy here
         either — this one did, and put the stale phrase straight back into
         the artifact it was cleaning up.) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Eliv8 OS",
        "url": "https://eliv8os.com",
        "logo": "https://eliv8os.com/favicon.svg",
        "email": "support@eliv8os.com",
        "description": "An AI business advisor that reads your actual numbers, remembers what you decided and why, argues the hard calls both ways, and treats how the business is run as mattering — not only what it earns."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
