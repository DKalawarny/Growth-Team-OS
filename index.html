<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Default head — these are the FALLBACK values served before React mounts
      and before <Helmet> takes over. Per-page values live in src/pages/*.jsx
      and src/lib/seo.js.

      Note for crawlers that don't run JavaScript (some link-preview bots,
      legacy SEO tools): they'll only see what's in this file. The full
      page-specific meta + JSON-LD only renders once React + Helmet mount.
      That's the prerendering gap flagged for a follow-up session.
    -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://growthos.ca/" />

    <title>GrowthOS — AI advisor + business tools for home-services contractors</title>
    <meta
      name="description"
      content="AI business advisor for plumbers, electricians, HVAC, roofing, demolition, masonry, landscaping, and every home-services trade. Cash flow forecasting, hiring planner, Google Business Profile audit, AI search visibility, and a finished document every time. $97/month, 7-day free trial."
    />
    <meta
      name="keywords"
      content="AI advisor for contractors, home services business software, contractor business management software, AI for service businesses, CFO dashboard for small business, cash flow forecasting for contractors, hiring planner for trades, Google Business Profile audit, local SEO for plumbers electricians HVAC, AI search visibility, contractor CRM, home services CRM, specialty trade contractor software, plumber business software, electrician business software, HVAC business software, roofing business software, demolition contractor software, construction business AI, small business operating system, QuickBooks AI advisor, safety compliance tracking software"
    />
    <meta name="author" content="GrowthOS" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#0F172A" />

    <!-- Open Graph / Facebook / Slack / iMessage / LinkedIn / Discord -->
    <meta property="og:type"            content="website" />
    <meta property="og:url"             content="https://growthos.ca/" />
    <meta property="og:title"           content="GrowthOS — AI advisor + business tools for home-services contractors" />
    <meta property="og:description"     content="AI business advisor for plumbers, electricians, HVAC, roofing, demolition, landscaping, and every home-services trade. CFO dashboard, cash flow forecasting, hiring planner, Local + AI Visibility audit. $97/month." />
    <meta property="og:image"           content="https://growthos.ca/og-default.png" />
    <meta property="og:image:width"     content="1200" />
    <meta property="og:image:height"    content="630" />
    <meta property="og:site_name"       content="GrowthOS" />
    <meta property="og:locale"          content="en_CA" />

    <!-- Twitter / X -->
    <meta name="twitter:card"           content="summary_large_image" />
    <meta name="twitter:url"            content="https://growthos.ca/" />
    <meta name="twitter:title"          content="GrowthOS — AI advisor + business tools for home-services contractors" />
    <meta name="twitter:description"    content="AI business advisor for plumbers, electricians, HVAC, roofing, demolition, landscaping, and every home-services trade. $97/month, 7-day free trial." />
    <meta name="twitter:image"          content="https://growthos.ca/og-default.png" />

    <!-- Mobile / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GrowthOS" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Default Organization JSON-LD — present even before React mounts so
         crawlers without JS still know who runs the site. Per-page schemas
         (SoftwareApplication, Product, FAQPage) are added by Helmet. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "GrowthOS",
        "url": "https://growthos.ca",
        "logo": "https://growthos.ca/favicon.svg",
        "email": "dkalawarny@hotmail.com",
        "description": "AI-powered operating system for home-services and specialty-trade contractors — combining an AI business advisor with tools for cash flow, hiring, marketing, compliance, and operations."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
