<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Caveat:wght@700&display=swap">
  <style>
    body { margin: 0; font-family: Figtree, ui-sans-serif, system-ui, sans-serif; }
    a { color: #2F7D4F; } a:hover { color: #24603c; }
    /* The highlighter stroke, not a filled block — and it must never break
       across a line, which is what the nowrap is for. */
    mark { background: linear-gradient(transparent 38%, #FFE566 38% 92%, transparent 92%); padding: 0 2px; white-space: nowrap; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; box-sizing: border-box; background: #FFFDF8; color: #23301F; font-family: Figtree, ui-sans-serif, system-ui, sans-serif; padding: 56px 28px 30px; display: flex; flex-direction: column;">
  <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: #2F7D4F;">
    <span style="width: 10px; height: 10px; border-radius: 50%; background: #FFB43A; display: inline-block; flex: none;"></span>
    the way out
    <span style="margin-left: auto; font-weight: 500; color: #6B7561;">5 of 6</span>
  </div>
  <p style="font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; margin: 34px 0 0;">What would you trade, and where are you?</p>
  <p style="font-size: 18px; font-weight: 700; line-height: 1.3; margin: 26px 0 0;">Put these in order — what you’d give up first at the top.</p>
  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
    <div style="display: flex; align-items: center; gap: 12px; background: #F5F1E6; border-radius: 14px; padding: 14px 16px; font-size: 16px; font-weight: 600;">
      <span style="color: #6B7561; width: 18px; font-variant-numeric: tabular-nums;">1</span>Comfort
      <span style="margin-left: auto; display: flex; gap: 4px;">
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; opacity: .3;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#23301F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; opacity: 1;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#23301F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></span>
      </span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #F5F1E6; border-radius: 14px; padding: 14px 16px; font-size: 16px; font-weight: 600;">
      <span style="color: #6B7561; width: 18px; font-variant-numeric: tabular-nums;">2</span>Status
      <span style="margin-left: auto; display: flex; gap: 4px;">
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; opacity: 1;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#23301F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; opacity: 1;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#23301F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></span>
      </span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #F5F1E6; border-radius: 14px; padding: 14px 16px; font-size: 16px; font-weight: 600;">
      <span style="color: #6B7561; width: 18px; font-variant-numeric: tabular-nums;">3</span>Space
      <span style="margin-left: auto; display: flex; gap: 4px;">
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; opacity: 1;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#23301F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; opacity: 1;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#23301F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></span>
      </span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #F5F1E6; border-radius: 14px; padding: 14px 16px; font-size: 16px; font-weight: 600;">
      <span style="color: #6B7561; width: 18px; font-variant-numeric: tabular-nums;">4</span>Savings
      <span style="margin-left: auto; display: flex; gap: 4px;">
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; opacity: 1;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#23301F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; opacity: 1;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#23301F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></span>
      </span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #F5F1E6; border-radius: 14px; padding: 14px 16px; font-size: 16px; font-weight: 600;">
      <span style="color: #6B7561; width: 18px; font-variant-numeric: tabular-nums;">5</span>Stability
      <span style="margin-left: auto; display: flex; gap: 4px;">
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; opacity: 1;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#23301F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; opacity: 1;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#23301F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></span>
      </span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #F5F1E6; border-radius: 14px; padding: 14px 16px; font-size: 16px; font-weight: 600;">
      <span style="color: #6B7561; width: 18px; font-variant-numeric: tabular-nums;">6</span>Proximity to family
      <span style="margin-left: auto; display: flex; gap: 4px;">
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; opacity: 1;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#23301F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FFFDF8; display: inline-flex; align-items: center; justify-content: center; opacity: .3;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#23301F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></span>
      </span>
    </div>
  </div>
  <p style="font-size: 18px; font-weight: 700; line-height: 1.3; margin: 26px 0 0;">How long are you giving this?</p>
  <div style="display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0;">
    <span style="border: 2px solid #DCD6C6; background: #fff; color: #23301F; border-radius: 999px; padding: 10px 16px; font-size: 14.5px; font-weight: 600; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center;">6 months</span>
    <span style="border: 2px solid #DCD6C6; background: #fff; color: #23301F; border-radius: 999px; padding: 10px 16px; font-size: 14.5px; font-weight: 600; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center;">1 year</span>
    <span style="border: 2px solid #2F7D4F; background: #E8F3EC; color: #2F7D4F; border-radius: 999px; padding: 10px 16px; font-size: 14.5px; font-weight: 600; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center;">3 years</span>
    <span style="border: 2px solid #DCD6C6; background: #fff; color: #23301F; border-radius: 999px; padding: 10px 16px; font-size: 14.5px; font-weight: 600; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center;">5+ years</span>
  </div>
  <p style="font-size: 18px; font-weight: 700; line-height: 1.3; margin: 26px 0 0;">Where are you?</p>
  <div style="margin-top: 10px; border-bottom: 3px solid #23301F; padding: 8px 0; font-size: 18px; line-height: 1.45; color: #A9AE9C; min-height: 30px;">City or region</div>
  <div style="display: flex; gap: 12px; align-items: center; margin-top: auto; padding-top: 26px;">
    <span style="width: 56px; height: 56px; border-radius: 50%; border: 2px solid #DCD6C6; display: inline-flex; align-items: center; justify-content: center; flex: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#23301F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </span>
    <button style="flex: 1; background: #2F7D4F; color: #fff; border: 0; border-radius: 999px; padding: 18px; font: inherit; font-family: Figtree, ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: 700; min-height: 44px;">Next</button>
  </div>
</div>
</x-dc>
</body>
</html>
