    the way out

    <span style="border: 2px solid #DCD6C6; background: #fff; color: #23301F; border-radius: 999px; padding: 10px 16px; font-size: 14.5px; font-weight: 600; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center;">Not working for someone else</span>

    <span style="border: 2px solid #DCD6C6; background: #fff; color: #23301F; border-radius: 999px; padding: 10px 16px; font-size: 14.5px; font-weight: 600; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center;">To be somewhere else</span>
