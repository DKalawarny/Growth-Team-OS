<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Eliv8 OS.
       The 8 alone, drawn as two stroked rings rather than set as type.
       An SVG used as a favicon renders sandboxed and cannot fetch a webfont,
       so anything typeset here would silently fall back to Arial. Stroked
       loops also keep their counters at 16px, where a filled glyph fills in. -->
  <rect width="48" height="48" rx="11" fill="#0D1413"/>
  <circle cx="24" cy="18.2" r="7.2" fill="none" stroke="#14A67B" stroke-width="4.4"/>
  <circle cx="24" cy="32.2" r="8.9" fill="none" stroke="#14A67B" stroke-width="4.4"/>
</svg>
