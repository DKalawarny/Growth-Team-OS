<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Home-screen icon. iOS applies its own mask, so the artwork is inset and
       the corner radius is left square — a rounded rect inside iOS's mask
       reads as a smaller badge floating in a tile. -->
  <rect width="180" height="180" fill="#0D1413"/>
  <circle cx="90" cy="72" r="27" fill="none" stroke="#14A67B" stroke-width="16.5"/>
  <circle cx="90" cy="124.5" r="33.5" fill="none" stroke="#14A67B" stroke-width="16.5"/>
</svg>
